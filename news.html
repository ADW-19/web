<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方动态 - Andy Yanqi Wang</title>
    <style>
        :root {
            --bg-card: #13131f;
            --bg-card-hover: #191928;
            --text-primary: #e8e8ed;
            --text-secondary: #c8c8d4;
            --text-muted: #a0a0b0;
            --accent: #e8453c;
            --accent-light: #ff6b5f;
            --border: #1e1e32;
            --border-hover: #2a2a45;
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius-md: 12px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            background: #06060a;
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 110px 32px 80px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 36px;
            transition: color 0.15s ease;
        }
        .back-link:hover { color: var(--accent-light); }
        .section-label {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 40px;
        }
        .news-item {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 24px 28px;
            margin-bottom: 18px;
            transition: all 0.3s ease;
        }
        .news-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            transform: translateX(6px);
            box-shadow: var(--shadow-md);
        }
        .news-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .news-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .news-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .news-item .read-more {
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-light);
        }
        .news-search { margin-bottom: 24px; }
        .news-search input {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            transition: border-color 0.15s ease;
        }
        .news-search input:focus { border-color: var(--accent); }
        .news-pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
        }
        .news-pager button {
            padding: 8px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.15s ease;
        }
        .news-pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); }
        .news-pager button:disabled { opacity: 0.35; cursor: default; }
        .news-pager span {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-muted);
        }
        .status {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 14px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #08080c; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        @media (max-width: 768px) {
            .container { padding: 90px 20px 60px; }
            .news-item { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← <span id="backText">返回主页</span></a>
        <div class="section-label" id="label">/ 官方新闻</div>
        <h1 id="title">全部动态</h1>
        <div class="news-search"><input id="searchInput" type="search"></div>
        <div id="newsList"></div>
        <div class="news-pager" id="pager" style="display:none;">
            <button id="prevBtn"></button>
            <span id="pageInfo"></span>
            <button id="nextBtn"></button>
        </div>
    </div>

    <script src="news-data.js"></script>
    <script>
        const lang = localStorage.getItem('site-lang') || 'en';
        const zh = lang === 'zh';

        document.documentElement.lang = zh ? 'zh-CN' : 'en';
        document.title = zh ? '官方动态 - Andy Yanqi Wang' : 'Official News - Andy Yanqi Wang';
        document.getElementById('backText').textContent = zh ? '返回主页' : 'Back to Home';
        document.getElementById('label').textContent = zh ? '/ 官方新闻' : '/ Official News';
        document.getElementById('title').textContent = zh ? '全部动态' : 'All Updates';

        const readMoreText = zh ? '阅读全文 →' : 'Read more →';
        document.getElementById('searchInput').placeholder = zh ? '搜索动态…' : 'Search news…';
        document.getElementById('prevBtn').textContent = zh ? '← 上一页' : '← Prev';
        document.getElementById('nextBtn').textContent = zh ? '下一页 →' : 'Next →';

        // ===== 搜索 + 分页 =====
        const PAGE_SIZE = 5;
        let page = 1;
        const input = document.getElementById('searchInput');
        const texts = NEWS_DATA.map(m => ({
            m,
            hay: (m[lang].title + ' ' + m[lang].excerpt + ' ' + m[lang].html.replace(/<[^>]+>/g, ' ')).toLowerCase()
        }));

        function render() {
            const q = input.value.trim().toLowerCase();
            const hits = texts.filter(t => !q || t.hay.includes(q)).map(t => t.m);
            const pages = Math.max(1, Math.ceil(hits.length / PAGE_SIZE));
            if (page > pages) page = pages;
            const slice = hits.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

            document.getElementById('newsList').innerHTML = slice.length ? slice.map(m => `
                <a class="news-item" href="news-article.html?f=${encodeURIComponent(m.filename)}">
                    <div class="news-date">${m.date}</div>
                    <div class="news-title">${m[lang].title}</div>
                    <div class="news-desc">${m[lang].excerpt}…</div>
                    <span class="read-more">${readMoreText}</span>
                </a>
            `).join('') : `<div class="status">${zh ? '没有找到相关动态' : 'No matching updates'}</div>`;

            const pager = document.getElementById('pager');
            pager.style.display = pages > 1 ? 'flex' : 'none';
            document.getElementById('pageInfo').textContent = `${page} / ${pages}`;
            document.getElementById('prevBtn').disabled = page <= 1;
            document.getElementById('nextBtn').disabled = page >= pages;
        }

        input.addEventListener('input', () => { page = 1; render(); });
        document.getElementById('prevBtn').addEventListener('click', () => { page--; render(); });
        document.getElementById('nextBtn').addEventListener('click', () => { page++; render(); });
        render();
    </script>
</body>
</html>
